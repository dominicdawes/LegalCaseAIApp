services:
  - type: web
    name: law-school-study-ws
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    pythonVersion: 3.9.12

  - name: law-school-study-worker
    type: worker
    env: python
    runtime: python3
    buildCommand: "pip install -r requirements-worker.txt && pip uninstall -y opencv-python opencv-python-headless && pip install --no-cache-dir opencv-python-headless"
    startCommand: "celery -A tasks.celery_app worker --loglevel=info --concurrency=2"
    pythonVersion: 3.9.12